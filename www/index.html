        function applyLanguage(lang) {
            const t = translations[lang] || translations.it;
            document.documentElement.lang = lang;
            document.title = t.title;

            document.querySelectorAll('[data-i18n]').forEach((el) => {
                const key = el.getAttribute('data-i18n');
                if (t[key] !== undefined) {
                    el.textContent = t[key];
                }
            });

            const privacyLink = document.getElementById('privacy-link');
            privacyLink.setAttribute('href', t.privacyFile);

            const termsLink = document.getElementById('terms-link');
            termsLink.setAttribute('href', t.termsFile);

            const featuresList = document.getElementById('features-list');
            featuresList.innerHTML = '';
            t.features.forEach((feature) => {
                const li = document.createElement('li');
                li.textContent = feature;
                featuresList.appendChild(li);
            });

            const startList = document.getElementById('start-list');
            startList.innerHTML = '';
            t.start.forEach((step) => {
                const li = document.createElement('li');
                li.textContent = step;
                startList.appendChild(li);
            });

            localStorage.setItem('smstomail-lang', lang);
        }

        function detectLanguage() {
            const saved = localStorage.getItem('smstomail-lang');
            if (saved && translations[saved]) {
                return saved;
            }
            const browserLang = (navigator.language || 'it').toLowerCase();
            if (browserLang.startsWith('pt')) return 'pt-br';
            const short = browserLang.slice(0, 2);
            return translations[short] ? short : 'it';
        }

        const switcher = document.getElementById('lang-switcher');
        const initialLang = detectLanguage();
        switcher.value = initialLang;
        applyLanguage(initialLang);

        switcher.addEventListener('change', (e) => applyLanguage(e.target.value));
